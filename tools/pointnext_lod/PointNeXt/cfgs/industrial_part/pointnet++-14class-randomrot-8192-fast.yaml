# PointNet++ baseline for 14-class industrial part classification, 8192 points.
use_amp: True
num_points: 8192
num_classes: 14
dataset:
  common:
    NAME: IndustrialPartPointCloud
    data_dir: ../pointcloud_data_14class_direct
  train:
    split: train
    num_points: 8192
  val:
    split: test
    num_points: 8192
  test:
    split: test
    num_points: 8192

feature_keys: pos

datatransforms:
  train: [RandomRotate, PointsToTensor, PointCloudScaleAndTranslate]
  val: [PointsToTensor]
  test: [PointsToTensor]
  kwargs:
    angle: [1, 1, 1]
    shift: [0.2, 0.2, 0.2]

batch_size: 16
val_batch_size: 32
dataloader:
  num_workers: 8

sched: cosine
epochs: 100
warmup_epochs: 0
min_lr: null
lr: 0.001
optimizer:
  NAME: adamw
  weight_decay: 0.05
grad_norm_clip: 1
criterion_args:
  NAME: SmoothCrossEntropy
  label_smoothing: 0.2

log_dir: industrial_part_14class_pointnetpp_randomrot_8192_fast
print_freq: 10
val_freq: 5
pretrained_path: null

wandb:
  use_wandb: False
  project: PointNeXt-IndustrialPart-14Class-PointNetPP-8192

seed: null

model:
  NAME: BaseCls
  encoder_args:
    NAME: PointNet2Encoder
    in_channels: 3
    width: null
    layers: 3
    use_res: False
    strides: [2, 4, 1]
    mlps: [[[64, 64, 128]], [[128, 128, 256]], [[256, 512, 1024]]]
    radius: [0.2, 0.4, null]
    num_samples: [32, 64, null]
    sampler: fps
    aggr_args:
      NAME: convpool
      feature_type: dp_fj
      anisotropic: False
      reduction: max
    group_args:
      NAME: ballquery
      use_xyz: True
      normalize_dp: False
    conv_args:
      order: conv-norm-act
    act_args:
      act: relu
    norm_args:
      norm: bn
  cls_args:
    NAME: ClsHead
    num_classes: 14
    mlps: [512, 256]
    norm_args:
      norm: bn1d
