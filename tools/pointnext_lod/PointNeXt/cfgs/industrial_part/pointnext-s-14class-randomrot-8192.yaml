# 14-class industrial part classification, 8192 points, random 3D orientation augmentation.
num_points: 8192
num_classes: 14
dataset:
  common:
    NAME: IndustrialPartPointCloud
    data_dir: ../pointcloud_data_14class_direct
  train:
    split: train
    num_points: 8192
  val:
    split: test
    num_points: 8192
  test:
    split: test
    num_points: 8192

feature_keys: pos

datatransforms:
  train: [RandomRotate, PointsToTensor, PointCloudScaleAndTranslate]
  val: [PointsToTensor]
  test: [PointsToTensor]
  kwargs:
    angle: [1, 1, 1]
    shift: [0.2, 0.2, 0.2]

batch_size: 8
val_batch_size: 16
dataloader:
  num_workers: 4

sched: cosine
epochs: 150
warmup_epochs: 0
min_lr: null
lr: 0.001
optimizer:
  NAME: adamw
  weight_decay: 0.05
grad_norm_clip: 1
criterion_args:
  NAME: SmoothCrossEntropy
  label_smoothing: 0.2

log_dir: industrial_part_14class_randomrot_8192
print_freq: 10
val_freq: 1
pretrained_path: null

wandb:
  use_wandb: False
  project: PointNeXt-IndustrialPart-14Class-RandomRot-8192

seed: null

model:
  NAME: BaseCls
  encoder_args:
    NAME: PointNextEncoder
    blocks: [1, 1, 1, 1, 1, 1]
    strides: [1, 2, 2, 2, 2, 1]
    width: 32
    in_channels: 3
    radius: 0.15
    radius_scaling: 1.5
    sa_layers: 2
    sa_use_res: True
    nsample: 32
    expansion: 4
    aggr_args:
      feature_type: dp_fj
      reduction: max
    group_args:
      NAME: ballquery
      normalize_dp: True
    conv_args:
      order: conv-norm-act
    act_args:
      act: relu
    norm_args:
      norm: bn
  cls_args:
    NAME: ClsHead
    num_classes: 14
    mlps: [512, 256]
    norm_args:
      norm: bn1d
