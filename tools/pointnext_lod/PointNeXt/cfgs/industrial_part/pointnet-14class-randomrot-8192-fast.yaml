# PointNet baseline for 14-class industrial part classification, 8192 points.
use_amp: True
num_points: 8192
num_classes: 14
dataset:
  common:
    NAME: IndustrialPartPointCloud
    data_dir: ../pointcloud_data_14class_direct
  train:
    split: train
    num_points: 8192
  val:
    split: test
    num_points: 8192
  test:
    split: test
    num_points: 8192

feature_keys: pos

datatransforms:
  train: [RandomRotate, PointsToTensor, PointCloudScaleAndTranslate]
  val: [PointsToTensor]
  test: [PointsToTensor]
  kwargs:
    angle: [1, 1, 1]
    shift: [0.2, 0.2, 0.2]

batch_size: 16
val_batch_size: 32
dataloader:
  num_workers: 8

sched: cosine
epochs: 100
warmup_epochs: 0
min_lr: null
lr: 0.001
optimizer:
  NAME: adamw
  weight_decay: 0.05
grad_norm_clip: 1
criterion_args:
  NAME: SmoothCrossEntropy
  label_smoothing: 0.2

log_dir: industrial_part_14class_pointnet_randomrot_8192_fast
print_freq: 10
val_freq: 5
pretrained_path: null

wandb:
  use_wandb: False
  project: PointNeXt-IndustrialPart-14Class-PointNet-8192

seed: null

model:
  NAME: BaseCls
  encoder_args:
    NAME: PointNetEncoder
    in_channels: 3
    input_transform: True
    feature_transform: True
  cls_args:
    NAME: ClsHead
    num_classes: 14
    in_channels: 1024
    mlps: [512, 256]
    norm_args:
      norm: bn1d
